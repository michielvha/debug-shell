<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Debug Shell</title>
  <desc id="desc">A terminal and connected DNS, HTTP, and TCP nodes for network troubleshooting.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cbd5e1" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1438" height="358" rx="28" fill="url(#background)" stroke="#334155"/>
  <rect x="1" y="1" width="1438" height="358" rx="28" fill="url(#grid)"/>
  <circle cx="1270" cy="48" r="118" fill="#06b6d4" fill-opacity=".12"/>
  <circle cx="1394" cy="306" r="170" fill="#a855f7" fill-opacity=".12"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="76" y="147" fill="#f8fafc" font-size="68" font-weight="750" letter-spacing="-2">Debug Shell</text>
    <text x="80" y="195" fill="#cbd5e1" font-size="25">Network and DNS troubleshooting</text>
    <text x="80" y="238" fill="#94a3b8" font-size="18">Kubernetes  |  Docker  |  Alpine</text>

    <rect x="744" y="66" width="384" height="228" rx="18" fill="#111c30" stroke="#334155"/>
    <path d="M744 104H1128" stroke="#334155"/>
    <circle cx="772" cy="85" r="5" fill="#06b6d4"/>
    <circle cx="791" cy="85" r="5" fill="#3b82f6"/>
    <circle cx="810" cy="85" r="5" fill="#a855f7"/>
    <text x="774" y="145" fill="#94a3b8" font-size="17">$</text>
    <text x="797" y="145" fill="#f8fafc" font-size="17">dig service.local</text>
    <text x="774" y="184" fill="#94a3b8" font-size="17">$</text>
    <text x="797" y="184" fill="#f8fafc" font-size="17">curl https://&lt;service&gt;</text>
    <text x="774" y="223" fill="#94a3b8" font-size="17">$</text>
    <text x="797" y="223" fill="#f8fafc" font-size="17">ip route</text>
    <rect x="797" y="249" width="9" height="19" rx="2" fill="url(#accent)"/>

    <path d="M1180 115 1260 178 1350 113M1260 178 1338 252" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1180" cy="115" r="23" fill="#111c30" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="1260" cy="178" r="23" fill="#111c30" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="1350" cy="113" r="23" fill="#111c30" stroke="#6366f1" stroke-width="3"/>
    <circle cx="1338" cy="252" r="23" fill="#111c30" stroke="#a855f7" stroke-width="3"/>
    <text x="1180" y="120" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">DNS</text>
    <text x="1260" y="183" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">HTTP</text>
    <text x="1350" y="118" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">TCP</text>
    <circle cx="1338" cy="252" r="6" fill="#a855f7"/>
  </g>
</svg>
