name: Build and Release Debug Shell Container

on:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: debug-shell:scan
          load: true

      - name: Test container tools and security contexts
        run: bash tests/image-smoke.sh debug-shell:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: debug-shell:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'  # Fail the build on any vulnerabilities
          scanners: 'vuln'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      id-token: write
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for GitVersion

      - name: Tag with GitVersion
        uses: michielvha/gitversion-tag-action@8cf5869816cf71437052ac97d086e00526bf2d89 # v7.0.4
        id: gitversion
        with:
          prefix: "v"

      - name: Build and Push Docker Image
        id: docker-build
        uses: michielvha/docker-release-action@066309e6b93a8304d96f6f301b9d972f5e43f6d7 # unreleased main snapshot
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          project: debug-shell
          version: ${{ steps.gitversion.outputs.semVer }}
          platforms: 'linux/amd64,linux/arm64'
          context: '.'
      
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: 1
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.image-digest }}
          IMAGE_TAG: ${{ steps.gitversion.outputs.semVer }}
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/debug-shell"
          
          echo "🔐 Signing image by digest (most secure)..."
          cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}" || { echo "❌ Image signing failed"; exit 1; }
          
      - name: Verify container image signature
        env:
          COSIGN_EXPERIMENTAL: 1
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.image-digest }}
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/debug-shell"
          
          echo "🔍 Verifying image signature..."
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}@${IMAGE_DIGEST}" || { echo "❌ Signature verification failed"; exit 1; }
      
      - name: Display outputs
        run: |
          echo "📦 Image digest: ${{ steps.docker-build.outputs.image-digest }}"
          echo "📦 Image reference: ghcr.io/${{ github.repository_owner }}/debug-shell:${{ steps.gitversion.outputs.semVer }}"
          echo "🔐 Image is signed with cosign (keyless signing via GitHub OIDC)"
